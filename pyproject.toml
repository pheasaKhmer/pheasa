[project]
name = "pheasa"
dynamic = ["version"]
description = "Open reference infrastructure for Khmer language AI: normalizer, benchmark, and datasets."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Samputhy Khim" }]
maintainers = [{ name = "Samputhy Khim" }]
keywords = ["khmer", "nlp", "unicode", "normalization", "benchmark"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/pheasaKhmer/pheasa"
Repository = "https://github.com/pheasaKhmer/pheasa"
Issues = "https://github.com/pheasaKhmer/pheasa/issues"
Changelog = "https://github.com/pheasaKhmer/pheasa/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pheasa/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src/pheasa", "LICENSE", "README.md", "CHANGELOG.md", "CITATION.cff"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
