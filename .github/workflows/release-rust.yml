name: Release (Rust)

on:
  push:
    tags: ["rust-v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      # rustup is on the runner; rust/rust-toolchain.toml picks the version and components.
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Check tag matches crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "rust-v${version}" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match crate version ${version}"; exit 1; }
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo publish --locked --dry-run

  publish:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/pheasa
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      # Exchanges the workflow's OIDC token for a short-lived crates.io token (trusted
      # publishing), so no long-lived token is stored.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
